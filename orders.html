<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — Patriotic Card Collector</title>
<style>
  :root{--navy:#0b1f3a;--navy-deep:#071527;--red:#a91e22;--gold:#d4a53f;--gold-bright:#f0c96b;--cream:#f4ead2;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Georgia,serif;background:var(--navy-deep);color:var(--cream);min-height:100vh;padding:2.5rem 4vw;}
  h1{font-family:'Trebuchet MS',sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-bright);margin-bottom:.3rem;}
  .sub{color:#9fb0c4;font-style:italic;margin-bottom:1.8rem;}
  .keybar{margin-bottom:1.5rem;display:flex;gap:.6rem;flex-wrap:wrap;}
  input{background:#13294a;border:1px solid rgba(212,165,63,.45);color:var(--cream);padding:.55rem .8rem;border-radius:6px;font-family:inherit;min-width:260px;}
  button{background:linear-gradient(180deg,var(--gold-bright),var(--gold));border:none;color:var(--navy-deep);font-family:'Trebuchet MS',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;padding:.6rem 1.2rem;border-radius:6px;cursor:pointer;}
  .order{background:linear-gradient(180deg,#13294a,#0c1e38);border:1px solid rgba(212,165,63,.35);border-radius:10px;padding:1.2rem 1.4rem;margin-bottom:1rem;display:grid;grid-template-columns:1fr 1fr auto;gap:1rem;align-items:center;}
  .order h3{font-family:'Trebuchet MS',sans-serif;font-size:1rem;color:var(--cream);margin-bottom:.25rem;}
  .meta{font-size:.8rem;color:#9fb0c4;}
  .addr{font-size:.85rem;line-height:1.45;color:#c6d2e0;white-space:pre-line;}
  .tag{display:inline-block;font-family:'Trebuchet MS',sans-serif;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;padding:.2rem .55rem;border-radius:3px;margin-right:.35rem;}
  .tag.demo{background:var(--red);color:var(--cream);}
  .tag.live{background:var(--gold);color:var(--navy-deep);}
  .actions{display:flex;flex-direction:column;gap:.5rem;align-items:flex-end;}
  .actions a{display:inline-block;background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:var(--navy-deep);text-decoration:none;font-family:'Trebuchet MS',sans-serif;font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;padding:.55rem 1rem;border-radius:5px;}
  .track{font-size:.75rem;color:var(--gold-bright);letter-spacing:.05em;}
  .empty{padding:3rem;text-align:center;color:#9fb0c4;font-style:italic;border:1px dashed rgba(212,165,63,.4);border-radius:10px;}
  .err{color:#ff9a94;margin-bottom:1rem;}
  a.back{color:var(--gold-bright);font-size:.85rem;}
  @media(max-width:820px){.order{grid-template-columns:1fr;}.actions{align-items:flex-start;}}
</style>
</head>
<body>
<h1>★ Order &amp; Label Dashboard</h1>
<p class="sub">Seller-only page — every paid order lands here with its shipping label ready to print. <a class="back" href="/">← back to storefront</a></p>

<div class="keybar">
  <input type="password" id="adminKey" placeholder="Admin key (if you set one in config.json)">
  <button onclick="loadOrders()">Load Orders</button>
</div>
<div id="msg"></div>
<div id="list"></div>

<script>
async function loadOrders(){
  const key = document.getElementById('adminKey').value;
  const msg = document.getElementById('msg');
  const list = document.getElementById('list');
  msg.textContent = ''; list.innerHTML = '';
  try{
    const r = await fetch('/api/orders?key=' + encodeURIComponent(key));
    if(r.status === 401){ msg.innerHTML = '<p class="err">Wrong admin key.</p>'; return; }
    const data = await r.json();
    if(!data.orders || !data.orders.length){
      list.innerHTML = '<div class="empty">No orders yet. When a buyer checks out, the order and its shipping label appear here automatically.</div>';
      return;
    }
    for(const o of data.orders){
      const s = o.shipping || {};
      const label = o.label || {};
      const div = document.createElement('div');
      div.className = 'order';
      div.innerHTML = `
        <div>
          <h3>${esc(o.item_title)}</h3>
          <div class="meta">$${esc(String(o.price))} • ${esc(o.created)} • order ${esc(o.id)}</div>
          <div style="margin-top:.45rem">
            <span class="tag ${o.live ? 'live' : 'demo'}">${o.live ? 'PAID — STRIPE' : 'DEMO ORDER'}</span>
            ${label.error ? '<span class="tag demo">LABEL FAILED</span>' : ''}
          </div>
        </div>
        <div class="addr">${esc(s.name)}\n${esc(s.street1)}${s.street2 ? '\n' + esc(s.street2) : ''}\n${esc(s.city)}, ${esc(s.state)} ${esc(s.zip)}${s.email ? '\n' + esc(s.email) : ''}</div>
        <div class="actions">
          ${label.label_url ? `<a href="${esc(label.label_url)}" target="_blank" rel="noopener">🖨️ Print Label</a>` : ''}
          ${label.tracking_number ? `<span class="track">${esc(label.tracking_number)}</span>` : ''}
          ${label.service ? `<span class="meta">${esc(label.carrier)} — ${esc(label.service)} ($${esc(String(label.label_cost))})</span>` : ''}
          ${label.error ? `<span class="err" style="font-size:.75rem;max-width:220px">${esc(label.error)}</span>` : ''}
        </div>`;
      list.appendChild(div);
    }
  }catch(e){
    msg.innerHTML = '<p class="err">Could not load orders — is the server running?</p>';
  }
}
function esc(t){ const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; }
loadOrders();
</script>
</body>
</html>
